<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Operation Pacific Shield</title><meta name="color-scheme" content="light dark">
<style>:root{--bg:#eef1f4;--card:#fff;--ink:#1b2430;--mut:#5b6775;--ac:#1f5fae;--ok:#2e8b3d;--bad:#c0392b;--ln:#cfd6de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181d;--card:#1d242c;--ink:#e6ebf0;--mut:#93a0ae;--ac:#5aa0ee;--ok:#5cc16b;--bad:#ef6a5b;--ln:#33404d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border-bottom:1px solid var(--ln)}
h1{font-size:16px;margin:0 8px 0 0}.st{font-weight:600}.st b{color:var(--ac)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px}nav button{white-space:nowrap}
main{padding:0 10px 30px;max-width:1000px;margin:auto}
button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:10px;margin:8px 0}.c h3{margin:0 0 6px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.t{border:1px solid var(--ln);border-radius:6px;padding:6px;cursor:pointer;font-size:13px}.t.d{background:var(--ok);color:#fff;border-color:var(--ok)}
.m{color:var(--mut);font-size:13px}.r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}input,select{font:inherit;width:70px;padding:3px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:5px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.sc{overflow-x:auto}pre{white-space:pre-wrap;margin:0;font-size:13px;max-height:160px;overflow:auto}

#opsAlert{max-width:1000px;margin:7px auto;padding:11px 14px;border-radius:8px;border:2px solid #e57e46;color:#fff;background:#812431;font-weight:750;animation:limfacPulse .8s infinite alternate}#opsAlert[hidden]{display:none!important}@keyframes limfacPulse{from{box-shadow:0 0 3px #e83847}to{box-shadow:0 0 22px #f85866}}
.flipdeck{width:140px;height:130px;padding:0;perspective:800px;border:0!important;background:transparent!important;color:inherit!important}.flipinner{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s}.flipdeck.flipped .flipinner{transform:rotateY(180deg)}.cardfront,.cardback{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;border:2px solid var(--ac);border-radius:10px;padding:10px;background:var(--card);text-align:center}.cardfront b,.cardback b{font-size:17px}.cardfront small,.cardback small{font-size:11px;color:var(--mut)}.cardback{transform:rotateY(180deg);border-color:var(--ok)}.flipdeck:disabled{opacity:1}.flipdeck:focus-visible{outline:3px solid var(--ac);outline-offset:4px}.cardrow{align-items:stretch}.t{display:block;width:100%;text-align:left}.t.d{background:var(--ok);color:#fff}.tasktime{display:block;font-size:10px;margin-top:3px;opacity:.9}.endex{position:fixed;inset:0;background:#090b11e8;display:grid;place-items:center;z-index:500;padding:12px}.endex-content{background:var(--card);border:2px solid var(--ok);border-radius:14px;padding:26px;max-width:500px;text-align:center;box-shadow:0 0 34px #40996e55}.endex-content h2{font-size:26px;color:var(--ok)}.endex-content button{margin:5px}@media(prefers-reduced-motion:reduce){#opsAlert{animation:none}.flipinner{transition:none}}
</style></head><body>
<header><h1>OPERATION PACIFIC SHIELD</h1><span class="st" id="top"></span></header>
<div id="opsAlert" role="alert" hidden></div><nav id="nav"></nav><main id="v"></main>
<script>const TASKS=["Bed down & Sanitation","Power","Command & Control","Contracts","Ramp Security","Perimeter Security","Missile Defense","Camouflage & Hardening","Airfield Ops","Mobility Support","Integrated Combat Turn","Specialized Refueling","Host Nation Relations","Health & Welfare","Base Recovery","Logistics Support"];
const GRP=["Establish","Defend","Operate","Maintain"],AC={"C-17":{r:4,pp:18,mix:[11,54],px:102},"C-130":{r:3,pp:8,mix:[2,62],px:128},"C-5":{r:4,pp:36,mix:[36,73],px:329}};
const MOBS=["Kadena AB","Andersen AFB","Yokota AB","Osan AB / JBPHH"];
const fresh=()=>({tab:"caoc",turn:1,day:1,MP:0,DP:0,RP:0,log:[],pool:{"C-17":12,"C-130":12,"C-5":4},alloc:MOBS.map(()=>({"C-17":0,"C-130":0,"C-5":0})),
tok:MOBS.map(()=>({fuel:4,bomb:4,missile:4,ammo:4})),
fos:MOBS.map(()=>[0,1,2,3].map(()=>({t:Array(16).fill(0),rfi:0,assessed:0,launched:0}))),
sel:MOBS.map(()=>0),med:{G:0,Y:0,R:0,B:0,bed:10,c130:0,c17:0},space:[1,2,3,4,5].map(i=>({z:i,thr:0,neu:0})),load:{ac:"C-17",opt:0,pp:0,px:0},cards:{turn:1,event:null,risk:null},chits:0,resourceChits:[],targetMP:0,endex:null,dpApplied:0});
let S;try{S=JSON.parse(localStorage.getItem("ops")||"")||fresh()}catch(e){S=fresh()}
if(!S||!Array.isArray(S.fos)||S.fos.length!==4||!Array.isArray(S.alloc)||S.alloc.length!==4)S=fresh();
S.cards??={turn:S.turn,event:null,risk:null};S.chits??=0;S.resourceChits??=[];S.targetMP??=0;S.endex??=null;S.dpApplied??=0;
const save=()=>{try{localStorage.setItem("ops",JSON.stringify(S))}catch(e){}},L=m=>{S.log.unshift(`D${S.day}/T${S.turn}: ${m}`);S.log=S.log.slice(0,40)};
const rd=n=>1+Math.floor(Math.random()*n),$=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let alertTimer=null;
function warn(msg){const el=$("#opsAlert");if(el){el.textContent="⚠ POSSIBLE LIMFAC: "+msg;el.hidden=false;clearTimeout(alertTimer);alertTimer=setTimeout(()=>{el.hidden=true},10000)}L("WARNING: "+msg)}
function scoreDP(){const reached=Math.floor(Math.max(0,S.DP)/5),assessed=S.dpApplied||0;if(reached>assessed){const change=reached-assessed;S.MP-=change;S.dpApplied=reached;L("DP threshold reached: -"+change+" MP (one MP for each five accumulated DP)")}}
function checkEndex(){if(S.endex||!S.targetMP)return;if(S.MP>=S.targetMP){S.endex={victory:true,day:S.day,turn:S.turn,mp:S.MP};L("ENDEX — YOU WIN THE BATTLE! Practice target reached. GM verification required.")}}
function setTargetMP(v){if(!Number.isFinite(v)||v<0){warn("Target must be zero or a positive number.");return}S.targetMP=Math.floor(v);L(S.targetMP?"GM practice victory target set to "+S.targetMP+" MP":"Victory target cleared (GM will determine ENDEX)")}
function resetGame(){if(!confirm("Reset the entire OPS game, including saved progress?"))return;S=fresh();S.fig=[16,16,16,16];S.names="";S.roles=null;S.nm={mob:4,med:1,space:1};S.tab="ov";save();draw()}
const TABS=[["ov","All Boards"],["roles","Roles"],["caoc","CAOC"],["m0","MOB 1"],["m1","MOB 2"],["m2","MOB 3"],["m3","MOB 4"],["load","Load Planner"],["med","MEDCOM"],["space","CSpOC"]];
S.fig=S.fig||[16,16,16,16];S.names=S.names||"";S.roles=S.roles||null;S.nm=S.nm||{mob:4,med:1,space:1};if(S.tab=="caoc"&&!S.seen){S.tab="ov";S.seen=1}
function go(t){S.tab=t;draw()}
function act(f){if(S.endex){warn("Mission reached ENDEX. Start New Game to change the mission.");save();draw();return}f();scoreDP();checkEndex();save();draw()}
const sel=(id,opts,v)=>`<select id="${id}">${opts.map(o=>`<option ${o==v?"selected":""}>${o}</option>`).join("")}</select>`;
function renderTop(){$("#top").innerHTML=`Day <b>${S.day}</b> · Turn <b>${S.turn}</b> · MP <b>${S.MP}</b> · RP <b>${S.RP}</b> · DP <b class="${S.DP?"bad":""}">${S.DP}</b> · Chits <b>${S.chits}</b>`;
$("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${S.tab==k?"on":""}" onclick="go('${k}')">${n}</button>`).join("")}
function caoc(){let h=`<div class="c"><h3>Turn control</h3><div class="r"><button onclick="act(nextTurn)">Next turn ▶</button><button onclick="act(nextDay)">Next day (reset aircraft pool)</button><button onclick="resetGame()">New game</button></div><div class="m">Next day applies 5 DP per FOS with Task 14 (Health &amp; Welfare) incomplete. Sealift gives each MOB 4 fuel/bomb/missile/ammo at the start of each block.</div></div>`;
h+=`<div class="c"><h3>Aircraft apportionment (daily pool; range C-17/C-5 4 hexes, C-130 3 hexes)</h3><div class="sc"><table><tr><td></td>${Object.keys(AC).map(a=>`<td><b>${a}</b></td>`).join("")}</tr>`;
MOBS.forEach((m,i)=>h+=`<tr><td>${m}</td>${Object.keys(AC).map(a=>`<td><button onclick="act(()=>al(${i},'${a}',-1))">−</button> ${S.alloc[i][a]} <button onclick="act(()=>al(${i},'${a}',1))">+</button></td>`).join("")}</tr>`);
h+=`<tr><td class="m">Unallocated</td>${Object.keys(AC).map(a=>`<td class="m">${S.pool[a]-S.alloc.reduce((s,x)=>s+x[a],0)}</td>`).join("")}</tr></table></div></div>`;
h+=`<div class="c"><h3>Event &amp; Risk cards — one of each per turn</h3><div class="r cardrow">${[["event","EVENT"],["risk","RISK"]].map(([k,label])=>{const d=S.cards[k];return `<button class="flipdeck ${d?"flipped":""}" onclick="act(()=>rollCard('${k}'))" ${d?"disabled":""} aria-label="${d?label+" card already drawn":"Reveal "+label+" card"}"><span class="flipinner"><span class="cardfront">? <b>${label}</b><small>CLICK TO REVEAL</small></span><span class="cardback">${label}<b>${d?"TEAM "+d.team+" / FOS "+d.fos:"?"}</b><small>${d?"GM adjudicates effect next turn":""}</small></span></span></button>`}).join("")}</div><div class="m">Event and Risk are separate draws. A D4 assigns the team and another D4 assigns the FOS. Effects are not simulated without GM adjudication. Next Turn is blocked until both are drawn.</div></div>`;
h+=`<div class="c"><h3>Score adjust</h3><div class="r">${["MP","DP","RP"].map(k=>`${k}: <button onclick="act(()=>adjustScore('${k}',-1))">−</button><button onclick="act(()=>adjustScore('${k}',1))">+</button><button onclick="act(()=>adjustScore('${k}',5))">+5</button>`).join(" &nbsp; ")}</div><div class="m">Targets: 20-str PLA = 10 MP, 12-str = 7 MP, 10-str = 5 MP.</div></div>`;
h+=`<div class="c"><h3>Mission objectives / ENDEX</h3><div class="r"><label for="gmTarget">GM-set victory MP target</label><input type="number" min="0" step="1" id="gmTarget" value="${S.targetMP||0}" style="width:85px"><button onclick="act(()=>setTargetMP(+$('#gmTarget').value))">Set target</button></div><div class="m">Target 0 means not set. Official victory total is determined by the assessing instructor; reaching a configured practice target displays ENDEX.</div></div>`;
h+=`<div class="c"><h3>Resource chits</h3><p><b>${S.chits}</b> chits earned from Task 13. The GM records resource type and destination on the physical board. Chits are not automatically assigned to fuel, food, water or tents.</p></div>`;
h+=`<div class="c"><h3>Combat (higher roll wins)</h3><div class="r">Fighter ${sel("fs",[10,12,18,20],12)} vs PLA ${sel("es",[10,12,20],10)} <button onclick="combat()">Roll</button><span id="cb"></span></div><div class="m">F-22 rolls d20.</div></div>`;
h+=`<div class="c"><h3>Dice</h3><div class="r">${[4,6,10,12,20].map(n=>`<button onclick="$('#dr').textContent='d${n}: '+rd(${n})">d${n}</button>`).join("")}<b id="dr"></b></div></div><div class="c"><h3>Log</h3><pre>${S.log.join("\n")||"—"}</pre></div>`;return h}
function adjustScore(k,d){if(!["MP","DP","RP"].includes(k))return;S[k]=k==="MP"?S[k]+d:Math.max(0,S[k]+d);L("GM score adjustment: "+k+" "+(d>0?"+":"")+d)}
function rollCard(kind){if(!["event","risk"].includes(kind))return;if(S.cards.turn!==S.turn)S.cards={turn:S.turn,event:null,risk:null};if(S.cards[kind])return warn(kind.toUpperCase()+" already drawn this turn.");const draw={team:rd(4),fos:rd(4),turn:S.turn};S.cards[kind]=draw;L(kind.toUpperCase()+" card drawn: Team "+draw.team+", FOS "+draw.fos+". GM to adjudicate effect next turn.")}
function al(i,a,d){const used=S.alloc.reduce((s,x)=>s+x[a],0),v=S.alloc[i][a]+d;if(v<0||(d>0&&used>=S.pool[a]))return;S.alloc[i][a]=v}
function nextTurn(){if(S.cards.turn!==S.turn||!S.cards.event||!S.cards.risk){warn("Draw both the Event and Risk cards before End Turn.");return}S.turn++;L("Turn advanced after Event and Risk draw");S.cards={turn:S.turn,event:null,risk:null};S.fos.forEach(f=>f.forEach((o,j)=>{if(o.t[12])S.RP+=2}));while(S.RP>=3){S.RP-=3;S.chits++;L("3 RP converted to 1 unassigned resource chit")}}
function nextDay(){const atRisk=S.fos.reduce((n,f)=>n+f.filter(o=>(o.assessed||o.t.some(Boolean))&&!o.t[13]).length,0);if(atRisk&&!confirm("⚠ POSSIBLE LIMFAC: "+atRisk+" active FOS do not have Task 14 (Health & Welfare). Advancing the day will assess "+(5*atRisk)+" DP. Are you sure?"))return;S.day++;S.pool={"C-17":12,"C-130":12,"C-5":4};S.alloc=MOBS.map(()=>({"C-17":0,"C-130":0,"C-5":0}));S.tok.forEach(t=>{t.fuel+=4;t.bomb+=4;t.missile+=4;t.ammo+=4});let n=0;S.fos.forEach(f=>f.forEach(o=>{if(o.assessed||o.t.some(x=>x))if(!o.t[13])n++}));S.DP+=5*n;L(`New day. Sealift delivered. ${n} FOS w/o Health & Welfare → +${5*n} DP`)}
function combat(){const f=+$("#fs").value,e=+$("#es").value,a=rd(f),b=rd(e);$("#cb").textContent=` ${a} vs ${b} → ${a>b?"Fighter wins":a<b?"PLA wins":"Tie (reroll)"}`}
function mob(i){const f=S.fos[i],k=S.sel[i],o=f[k],t=S.tok[i],est=[0,1,2,3].every(x=>o.t[x]),opr=[8,9,10,11].every(x=>o.t[x]),can=est&&opr;
let h=`<div class="c"><h3>${MOBS[i]} — tokens</h3><div class="r">${["fuel","bomb","missile","ammo"].map(x=>`${x}: <button onclick="act(()=>S.tok[${i}].${x}=Math.max(0,S.tok[${i}].${x}-1))">−</button><b>${t[x]}</b><button onclick="act(()=>S.tok[${i}].${x}++)">+</button>`).join(" &nbsp; ")}</div><div class="m">Fighters left: <b>${S.fig[i]}</b> (${["16 F-16","16 F-22","16 F-16","16 F-22"][i]} at start). Aircraft allocated: ${Object.keys(AC).map(a=>a+" ×"+S.alloc[i][a]).join(", ")}</div></div>`;
h+=`<div class="r">${f.map((_,j)=>`<button class="${j==k?"on":""}" onclick="act(()=>S.sel[${i}]=${j})">FOS ${j+1}</button>`).join("")}</div>`;
h+=`<div class="c"><h3>FOS ${k+1} — RFIs (${o.rfi}/10)</h3><div class="r"><button onclick="act(()=>rfi(${i},${k},-1))">−</button><button onclick="act(()=>rfi(${i},${k},1))">+ RFI answered</button>${o.assessed?'<span class="ok">Assessed ✔ (+5 MP)</span>':'<span class="m">5 per airfield needed to gain assets; 10 = full assessment</span>'}</div></div>`;
GRP.forEach((g,gi)=>{h+=`<div class="c"><h3>${g}</h3><div class="g">${[0,1,2,3].map(x=>{const n=gi*4+x;return `<button class="t ${o.t[n]?"d":""}" onclick="act(()=>toggleTask(${i},${k},${n}))">#${n+1} ${TASKS[n]}${o.t[n]&&o.taskAt?.[n]?`<small class="tasktime">${esc(o.taskAt[n])}</small>`:""}</button>`}).join("")}</div></div>`});
h+=`<div class="c"><h3>Launch fighters</h3><div class="r"><button ${can&&t.fuel&&t.bomb&&t.missile&&S.fig[i]>0?"":"disabled"} onclick="act(()=>launch(${i},${k}))">Launch sortie (+5 MP)</button> Launched here: ${o.launched}</div><div class="m">${can?"Establish &amp; Operate complete.":"Needs Establish (1–4) and Operate (9–12) complete."} Costs 1 fuel, 1 bomb, 1 missile; bring tokens to the CAOC.</div>${o.t[12]?'<div class="ok m">Task 13 resourced: +2 RP each turn.</div>':""}${o.t[13]?"":'<div class="bad m">Task 14 incomplete: 5 DP per day.</div>'}</div>`;return h}
function toggleTask(i,k,n){const o=S.fos[i]?.[k];if(!o||n<0||n>15)return;if(n===0&&!o.t[1])return warn("Task 2 POWER must be completed before Task 1 BEDDOWN/SANITATION.");if(n===1&&o.t[1]&&o.t[0])return warn("Undo Beddown/Sanitation first before removing its Power prerequisite.");o.t[n]=o.t[n]?0:1;o.taskAt??={};if(o.t[n])o.taskAt[n]="D"+S.day+" / T"+S.turn;else delete o.taskAt[n];L(MOBS[i]+" FOS"+(k+1)+" Task "+(n+1)+" "+(o.t[n]?"validated complete":"marked incomplete")+" by player") }
function rfi(i,k,step=1){const o=S.fos[i][k];if(!o)return;const before=o.rfi;o.rfi=Math.max(0,Math.min(10,before+step));if(before<10&&o.rfi===10&&!o.assessed){o.assessed=1;S.MP+=5;L(MOBS[i]+" FOS"+(k+1)+" assessed: +5 MP")}else if(before===10&&o.rfi<10&&o.assessed){o.assessed=0;S.MP-=5;L(MOBS[i]+" FOS"+(k+1)+" assessment withdrawn: -5 MP")} }
function launch(i,k){const o=S.fos[i]?.[k],t=S.tok[i];if(!o||![0,1,2,3,8,9,10,11].every(n=>o.t[n])||S.fig[i]<=0||t.fuel<1||t.bomb<1||t.missile<1)return warn("Sortie blocked: verify Establish and Operate tasks, fighter availability, fuel and munitions.");if(!confirm("Fighter launch: spend 1 fuel, 1 bomb and 1 missile and record +5 MP. Confirm GM-approved activated operating area and sortie?"))return;t.fuel--;t.bomb--;t.missile--;S.fos[i][k].launched++;S.fig[i]--;S.MP+=5;L(`${MOBS[i]} FOS${k+1} launched fighter +5 MP`)}
function load(){const l=S.load,a=AC[l.ac],o=[`Pallets only (${a.pp} PP)`,`Pallets & Pax (${a.mix[0]} PP + ${a.mix[1]} pax)`,`Pax only (${a.px})`];if(l.ac=="C-5")o.splice(0,1);
const op=Math.min(l.opt,o.length-1),i=l.ac=="C-5"?op+1:op,capPP=[a.pp,a.mix[0],0][i],capPX=[0,a.mix[1],a.px][i],ok=l.pp<=capPP&&l.px<=capPX;
return `<div class="c"><h3>Load planner</h3><div class="r">Aircraft ${sel("lac",Object.keys(AC),l.ac)} Option ${sel("lop",o,o[op])}</div><div class="r">Pallet positions <input id="lpp" type="number" min="0" value="${l.pp}"> Pax <input id="lpx" type="number" min="0" value="${l.px}"> <button onclick="ld()">Check</button></div>
<div class="${ok?"ok":"bad"}"><b>${ok?"Load valid":"Over capacity"}</b> — capacity ${capPP} PP, ${capPX} pax. Range ${a.r} hexes/turn (en-route download costs 1 hex).</div></div>`}
function ld(){const ac=$("#lac").value,ch=ac!=S.load.ac;S.load={ac,opt:ch?0:$("#lop").selectedIndex,pp:Math.max(0,Math.floor(Number($("#lpp").value)||0)),px:Math.max(0,Math.floor(Number($("#lpx").value)||0))};save();draw()}
function med(){const m=S.med,st=[["G","Green (minimal)"],["Y","Yellow (delayed)"],["R","Red (immediate)"],["B","Black (expectant)"]],tot=m.G+m.Y+m.R;
return `<div class="c"><h3>Patients &amp; bedspace</h3>${st.map(([k,n])=>`<div class="r"><span style="width:140px">${n}</span><button onclick="act(()=>S.med.${k}=Math.max(0,S.med.${k}-1))">−</button><b>${m[k]}</b><button onclick="act(()=>S.med.${k}++)">+</button></div>`).join("")}<div class="r">Bedspace <button onclick="act(()=>S.med.bed=Math.max(0,S.med.bed-1))">−</button><b>${m.bed}</b><button onclick="act(()=>S.med.bed+=10)">+10</button></div><div class="${tot>m.bed?"bad":"ok"}">In use ${tot} / ${m.bed} ${tot>m.bed?"— over capacity":""}</div></div>
<div class="c"><h3>MEDEVAC capacity</h3><div class="m">C-130 carries 15 litter patients, C-17 carries 30 (board count).</div><div class="r">C-130 sorties <button onclick="act(()=>S.med.c130=Math.max(0,S.med.c130-1))">−</button>${m.c130}<button onclick="act(()=>S.med.c130++)">+</button> C-17 sorties <button onclick="act(()=>S.med.c17=Math.max(0,S.med.c17-1))">−</button>${m.c17}<button onclick="act(()=>S.med.c17++)">+</button></div><div>Evacuation capacity: <b>${m.c130*15+m.c17*30}</b> patients</div></div>`}
function space(){return `<div class="c"><h3>CSpOC GEO zones</h3><div class="m">Track threats and neutralized targets per zone. Removing PLA targets helps the CFACC score.</div>${S.space.map((z,i)=>`<div class="r"><b style="width:60px">Zone ${z.z}</b>Threats <button onclick="act(()=>S.space[${i}].thr=Math.max(0,S.space[${i}].thr-1))">−</button>${z.thr}<button onclick="act(()=>S.space[${i}].thr++)">+</button> Neutralized <button onclick="act(()=>S.space[${i}].neu=Math.max(0,S.space[${i}].neu-1))">−</button>${z.neu}<button onclick="act(()=>S.space[${i}].neu++)">+</button></div>`).join("")}</div>`}
const ROLES={caoc:["CFACC / Mission Commander","Deputy MC","Game Master","ATO administrator","Aircraft allocator / TRANSCOM planner","Comms liaison","Scribe"],
mob:["MOB Mission Commander (AEW/CC)","Deputy MC","Game Master","Load planner","FOS 1 leader","FOS 2 leader","FOS 3 leader","FOS 4 leader","ATO administrator","Comms","Scribe"],
med:["Mission Commander","Deputy MC","Game Master","Comms POC (stays in room)","Comms liaison to CAOC","Comms liaison to MOB 1","Comms liaison to MOB 2","Comms liaison to MOB 3","Comms liaison to MOB 4"],
space:["Mission Commander","Deputy MC","Game Master","Comms POC (stays in room)","Comms liaison to CAOC","Comms liaison to MOB 1","Comms liaison to MOB 2","Comms liaison to MOB 3","Comms liaison to MOB 4"]};
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rd(i+1)-1;[a[i],a[j]]=[a[j],a[i]]}return a}
function roll(){S.names=$("#nm").value;const p=shuf(S.names.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean));
const m=Math.max(3,Math.min(4,+$("#nmob").value||4));S.nm={mob:m,med:$("#nmed").checked?1:0,space:$("#nsp").checked?1:0};
const B=[{n:"CAOC",r:ROLES.caoc}];for(let i=0;i<m;i++)B.push({n:"MOB "+(i+1)+" – "+MOBS[i],r:ROLES.mob});if(S.nm.med)B.push({n:"MEDCOM",r:ROLES.med});if(S.nm.space)B.push({n:"CSpOC",r:ROLES.space});
B.forEach(b=>b.a=[]);const mx=Math.max(...B.map(b=>b.r.length));let k=0;
for(let i=0;i<mx;i++)B.forEach(b=>{if(i<b.r.length&&k<p.length)b.a.push([b.r[i],p[k++]])});
let j=0;while(k<p.length){B[j%B.length].a.push(["Staff (MC's discretion)",p[k++]]);j++}
S.roles=B;L("Roles randomized ("+p.length+" people)");save();draw()}
function roles(){return `<div class="c"><h3>Randomize jobs</h3><div class="m">One name per line (or comma separated). Commanders and deputies are drawn first for every board, then the other positions in priority order. Leftover people become staff.</div><textarea id="nm" rows="7" style="width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:6px">${esc(S.names)}</textarea>
<div class="r">MOBs <select id="nmob"><option ${S.nm.mob==3?"selected":""}>3</option><option ${S.nm.mob==4?"selected":""}>4</option></select><label><input type="checkbox" id="nmed" style="width:auto" ${S.nm.med?"checked":""}> MEDCOM</label><label><input type="checkbox" id="nsp" style="width:auto" ${S.nm.space?"checked":""}> CSpOC</label><button class="on" onclick="roll()">🎲 Randomize jobs</button></div></div>`+(S.roles?S.roles.map(b=>`<div class="c"><h3>${esc(b.n)}</h3>${b.a.map(([r,n])=>`<div class="r"><span class="m" style="width:230px">${esc(r)}</span><b>${esc(n)}</b></div>`).join("")||'<span class="m">No one assigned</span>'}</div>`).join(""):"")}
function ov(){const mc=i=>{const b=S.roles&&S.roles.find(x=>x.n.startsWith("MOB "+(i+1)));return b&&b.a[0]?" · MC "+esc(b.a[0][1]):""};
const card=(t,k,body)=>`<div class="c" style="cursor:pointer" onclick="go('${k}')"><h3>${t} ›</h3><div class="m">${body}</div></div>`;
let h=`<div class="g">`+card("CAOC","caoc",`Day ${S.day}, turn ${S.turn}<br>MP ${S.MP} · RP ${S.RP} · DP ${S.DP}<br>Aircraft unallocated: ${Object.keys(AC).map(a=>a+" "+(S.pool[a]-S.alloc.reduce((s,x)=>s+x[a],0))).join(", ")}`);
MOBS.forEach((n,i)=>{const f=S.fos[i],rdy=f.filter(o=>[0,1,2,3,8,9,10,11].every(x=>o.t[x])).length;h+=card("MOB "+(i+1)+" – "+n,"m"+i,`FOS launch-ready: ${rdy}/4 · assessed ${f.filter(o=>o.assessed).length}/4<br>Fighters left ${S.fig[i]} · fuel ${S.tok[i].fuel} bomb ${S.tok[i].bomb} missile ${S.tok[i].missile}${mc(i)}`)});
const m=S.med;h+=card("MEDCOM","med",`Patients ${m.G+m.Y+m.R} / bedspace ${m.bed}<br>Evac capacity ${m.c130*15+m.c17*30}`);
h+=card("CSpOC","space",`Threats ${S.space.reduce((s,z)=>s+z.thr,0)} · neutralized ${S.space.reduce((s,z)=>s+z.neu,0)}`);
h+=card("Roles","roles",S.roles?S.roles.length+" boards staffed":"Not randomized yet");return h+`</div><div class="c"><h3>Log</h3><pre>${S.log.slice(0,8).join("\n")||"—"}</pre></div>`}
function draw(){renderTop();const m=S.tab.match(/^m(\d)$/);$("#v").innerHTML=(S.tab=="ov"?ov():S.tab=="roles"?roles():S.tab=="caoc"?caoc():m?mob(+m[1]):S.tab=="load"?load():S.tab=="med"?med():space())+(S.endex?`<div class="endex" role="dialog" aria-modal="true" aria-labelledby="endexTitle"><div class="endex-content"><div class="m">PRACTICE MISSION RESULT · GM VERIFICATION REQUIRED</div><h2 id="endexTitle">🏆 ENDEX — YOU WIN THE BATTLE!</h2><p>Target ${S.targetMP} MP reached. Current score: <b>${S.MP} MP</b>.</p><p>The assessing instructor determines the official OPS victory condition.</p><button onclick="resetGame()">PLAY AGAIN / NEW MISSION</button><button onclick="go('caoc')">VIEW CAOC</button></div></div>`:"")}
draw();
</script></body></html>
